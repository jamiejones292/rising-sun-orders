# Netlify build settings. Netlify reads this file automatically once the
# repository is connected, so nothing needs typing into Netlify's settings.

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  # Public database address and publishable key: safe to be visible, the
  # database's security rules protect the data. SECRET keys never go here;
  # they are added in Netlify's Environment variables screen.
  VITE_SUPABASE_URL = "https://faioegqaamrvbfzurzun.supabase.co"
  VITE_SUPABASE_PUBLISHABLE_KEY = "sb_publishable_u_5rOP4_gc1jvfTAhNNM4g_IEorneaP"

# One app serves every page (/, /staff, /admin), so send all paths to it.
# Files that exist (logo, scripts) and /.netlify/functions/* are served first.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Staff and admin pages must never appear in search results.
[[headers]]
  for = "/staff/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
