<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Rising Sun Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Cormorant+Garamond:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: forest-green sidebar (iPad/laptop) or top tab strip (phone) + ivory work area; each section is one view; editor slides in from the right.
   Single light theme by choice, matching the customer app and the ivory logo artwork. */
:root{
  --ivory:#FBF4EA; --paper:#FFFDF8; --vellum:#F2E8D6;
  --green:#132A1F; --green-2:#21402F; --green-3:#3B5C4A;
  --gold:#9C7840; --gold-ink:#7A5C2C; --gold-soft:#E9DBBF;
  --ink:#262A26; --muted:#6A675B; --line:#E4D7BF; --line-2:#D6C6A8;
  --ok:#2E6A47; --ok-bg:#E5F0E8; --warn:#9A6400; --warn-bg:#FBF0D9; --bad:#9A2F22; --bad-bg:#FBEAE5;
  --display:"Cormorant Garamond", "Iowan Old Style", Georgia, serif;
  --caps:"Cinzel", "Trajan Pro", Georgia, serif;
  --sans:"Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--ivory);color:var(--ink)}
body{font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3,.tile b,.money-list div.total{font-variant-numeric:lining-nums tabular-nums}
h1,h2,h3{font-family:var(--display);font-weight:600;color:var(--green);margin:0;line-height:1.1;text-wrap:balance}
.caps{font-family:var(--caps);letter-spacing:.2em;text-transform:uppercase;font-size:.68rem;color:var(--gold-ink)}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

/* Shell */
.shell{display:grid;grid-template-columns:1fr;min-height:100vh}
@media (min-width:900px){.shell{grid-template-columns:236px 1fr}}
.side{background:var(--green);color:var(--ivory);display:flex;flex-direction:column}
@media (min-width:900px){.side{position:sticky;top:0;height:100vh;padding-block:22px}}
.brand{padding-block:16px 10px;padding-left:max(18px, env(safe-area-inset-left, 0px));padding-right:18px}
.brand b{display:block;font-family:var(--display);font-size:1.45rem;font-weight:600;line-height:1}
.brand span{font-family:var(--caps);font-size:.6rem;letter-spacing:.3em;color:var(--gold-soft)}
.nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding-block:4px 10px;padding-left:max(12px, env(safe-area-inset-left, 0px));padding-right:12px}
.nav::-webkit-scrollbar{display:none}
@media (min-width:900px){.nav{flex-direction:column;overflow:visible;padding-top:22px}}
.nav button{flex:none;display:flex;align-items:center;gap:10px;background:none;border:0;color:var(--gold-soft);padding:10px 12px;border-radius:4px;text-align:left;font-weight:500;white-space:nowrap}
.nav button:hover{background:rgba(255,255,255,.06)}
.nav button[aria-current="page"]{background:var(--ivory);color:var(--green);font-weight:700}
.nav svg{width:18px;height:18px;flex:none}
.nav .lock{margin-left:auto;font-size:.7rem;opacity:.7}
.side-foot{margin-top:auto;padding:16px 18px;font-size:.8rem;color:var(--gold-soft);display:none}
@media (min-width:900px){.side-foot{display:block}}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;border-bottom:1px solid var(--line);background:var(--paper);padding-block:12px;padding-left:max(18px, env(safe-area-inset-left, 0px));padding-right:max(18px, env(safe-area-inset-right, 0px))}
.example{font-size:.78rem;font-weight:700;letter-spacing:.06em;background:var(--gold-soft);color:var(--gold-ink);border-radius:3px;padding:3px 8px}
.role{display:flex;align-items:center;gap:8px;margin-left:auto;font-size:.85rem;color:var(--muted)}
.role select{height:36px;border:1px solid var(--line-2);border-radius:4px;background:var(--paper);padding:0 8px;color:var(--green);font-weight:600}
.status-pill{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:6px 12px;font-size:.82rem;font-weight:700;background:var(--ok-bg);color:var(--ok);border:0}
.status-pill.paused{background:var(--bad-bg);color:var(--bad)}
.status-pill i{width:8px;height:8px;border-radius:50%;background:currentColor}
.content{padding-block:24px 60px;padding-left:max(18px, env(safe-area-inset-left, 0px));padding-right:max(18px, env(safe-area-inset-right, 0px));max-width:1180px;width:100%;display:flex;flex-direction:column;gap:22px}
.view-h{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.view-h h1{font-size:2.2rem}
.view-h p{margin:4px 0 0;color:var(--muted);max-width:62ch}

/* Controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:4px;border:1px solid var(--green);background:var(--green);color:var(--ivory);font-weight:600;white-space:nowrap}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#fff;font-weight:700;letter-spacing:.04em}
.btn.ghost{background:var(--paper);color:var(--green);border-color:var(--line-2)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.danger-ghost{background:var(--paper);color:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:34px;padding:0 12px;font-size:.85rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.sw{position:relative;width:52px;height:30px;border-radius:15px;border:0;background:var(--line-2);flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.sw[aria-checked="true"]{background:var(--ok)}
.sw[aria-checked="true"]::after{transform:translateX(22px)}
.sw[disabled]{opacity:.45;cursor:not-allowed}
.sw-l{font-size:.78rem;font-weight:700;min-width:28px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field > span{font-size:.82rem;font-weight:700;color:var(--green)}
.field small{color:var(--muted);font-size:.8rem}
.in{height:44px;border:1px solid var(--line-2);border-radius:4px;background:var(--paper);padding:0 12px;width:100%;min-width:0}
textarea.in{height:auto;min-height:84px;padding:10px 12px;resize:vertical}
.money{position:relative}
.money::before{content:"£";position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.money .in{padding-left:24px;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line-2);background:var(--paper);border-radius:999px;padding:6px 12px;font-size:.85rem;font-weight:500}
.chip[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:var(--ivory)}
.pill{display:inline-block;font-size:.74rem;font-weight:700;border-radius:3px;padding:2px 8px;white-space:nowrap}
.p-ok{background:var(--ok-bg);color:var(--ok)} .p-warn{background:var(--warn-bg);color:var(--warn)} .p-bad{background:var(--bad-bg);color:var(--bad)}
.p-new{background:var(--gold-soft);color:var(--gold-ink)} .p-neutral{background:var(--vellum);color:var(--muted)}

/* Panels */
.panel{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel > h2{font-size:1.45rem}
.panel-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px}
.panel-h h2{font-size:1.45rem}
.grid2{display:grid;grid-template-columns:1fr;gap:22px;align-items:start}
@media (min-width:1000px){.grid2{grid-template-columns:3fr 2fr}}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (min-width:700px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:14px 16px;min-width:0}
.tile small{display:block;font-size:.78rem;color:var(--muted);font-weight:600}
.tile b{display:block;font-family:var(--display);font-size:2rem;color:var(--green);font-variant-numeric:tabular-nums;line-height:1.1;margin-top:4px}
.tile span{font-size:.78rem;color:var(--muted)}

.ordering{background:var(--green);color:var(--ivory);border-radius:6px;padding:20px;display:flex;flex-wrap:wrap;align-items:center;gap:16px;justify-content:space-between}
.ordering.paused{background:var(--bad)}
.ordering .caps{color:var(--gold-soft)}
.ordering.paused .caps{color:#F6D9D2}
.ordering h2{color:#fff;font-size:1.8rem;margin-top:4px}
.ordering p{margin:4px 0 0;color:var(--gold-soft);font-size:.9rem;max-width:56ch}
.ordering.paused p{color:#F6D9D2}
.ordering .btn{background:var(--ivory);color:var(--green);border-color:var(--ivory);min-height:52px;font-weight:700;letter-spacing:.04em}
.ordering.paused .btn{color:var(--bad)}

.attn{display:flex;flex-direction:column}
.attn button{display:flex;gap:12px;align-items:flex-start;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:12px 0;width:100%}
.attn button:first-child{border-top:0}
.attn .ic{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.8rem;flex:none}
.attn b{color:var(--green);display:block}
.attn span{font-size:.85rem;color:var(--muted)}

/* Drinks list */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.toolbar .search{flex:1 1 220px;max-width:360px}
.toolbar select.in{width:auto;flex:0 1 220px}
.cat-block{display:flex;flex-direction:column}
.cat-block > h2{font-size:1.4rem;padding-bottom:6px;border-bottom:1px solid var(--gold);display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.cat-block > h2 span{font-family:var(--sans);font-size:.8rem;color:var(--muted);font-weight:500}
.drow{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;padding:14px 0;border-bottom:1px solid var(--line)}
@media (min-width:760px){.drow{grid-template-columns:minmax(0,1.1fr) minmax(0,1.6fr) auto;align-items:start}}
.drow.off .dname{color:var(--muted)}
.drow.archived{opacity:.6}
.dname{font-weight:700;color:var(--green);font-size:1.02rem}
.dmeta{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;font-size:.8rem;color:var(--muted)}
.vars{display:flex;flex-direction:column;gap:6px}
.var{display:grid;grid-template-columns:minmax(0,1fr) 72px auto auto;gap:10px;align-items:center;font-size:.9rem}
.var .vp{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.var.off .vl,.var.off .vp{color:var(--muted);text-decoration:line-through}
.dact{display:flex;gap:8px;align-items:center;justify-content:flex-start}
@media (min-width:760px){.dact{justify-content:flex-end}}

/* Drawer */
.scrim{position:fixed;inset:0;background:rgba(19,42,31,.4);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(100%,560px);background:var(--ivory);z-index:41;display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(19,42,31,.2);border-left:3px solid var(--gold)}
.drawer-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-block:calc(16px + env(safe-area-inset-top, 0px)) 14px;padding-left:20px;padding-right:max(20px, env(safe-area-inset-right, 0px));border-bottom:1px solid var(--line);background:var(--paper)}
.drawer-h h2{font-size:1.7rem}
.drawer-b{overflow-y:auto;padding-block:18px 24px;padding-left:20px;padding-right:max(20px, env(safe-area-inset-right, 0px));display:flex;flex-direction:column;gap:18px}
.drawer-f{display:flex;flex-wrap:wrap;gap:10px;padding-block:12px calc(14px + env(safe-area-inset-bottom, 0px));padding-left:20px;padding-right:max(20px, env(safe-area-inset-right, 0px));border-top:1px solid var(--line);background:var(--paper)}
.drawer-f .grow{flex:1}
.x{width:38px;height:38px;border-radius:50%;border:1px solid var(--line-2);background:var(--paper);font-size:1rem;color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sizes{display:flex;flex-direction:column;gap:8px}
.size{display:grid;grid-template-columns:minmax(0,1fr) 108px auto 34px;gap:8px;align-items:center}
.size .rm{width:34px;height:34px;border-radius:4px;border:1px solid var(--line-2);background:var(--paper);color:var(--muted)}
.checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 14px}
@media (min-width:480px){.checks.three{grid-template-columns:repeat(3,minmax(0,1fr))}}
.ck{display:flex;align-items:center;gap:8px;font-size:.9rem}
.ck input{width:18px;height:18px;accent-color:var(--green);flex:none}
.photo{display:flex;gap:14px;align-items:center}
.photo .ph{width:84px;height:84px;border-radius:4px;border:1px dashed var(--line-2);background:var(--vellum);display:grid;place-items:center;color:var(--muted);font-size:.75rem;text-align:center;overflow:hidden;flex:none}
.photo .ph img{width:100%;height:100%;object-fit:cover}
.err{color:var(--bad);font-size:.85rem;margin:0}
.confirm-box{border:1px solid var(--bad);background:var(--bad-bg);border-radius:4px;padding:12px;display:flex;flex-direction:column;gap:10px;color:var(--bad);font-size:.9rem}

/* Tables (data) */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--paper)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th{text-align:left;font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--vellum)}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.items-cell{min-width:200px;color:var(--muted)}

/* Categories */
.catrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.ord{display:flex;flex-direction:column;gap:2px}
.ord button{width:30px;height:22px;border:1px solid var(--line-2);background:var(--paper);border-radius:3px;font-size:.7rem;line-height:1;color:var(--green)}
.ord button[disabled]{opacity:.3}

/* Tables & QR */
.areas{display:grid;grid-template-columns:1fr;gap:16px}
.tlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:0 28px}
.trow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.trow b{font-variant-numeric:tabular-nums;color:var(--green)}
.trow.off b{color:var(--muted);text-decoration:line-through}
.stand{display:grid;grid-template-columns:1fr;gap:18px;align-items:center}
@media (min-width:760px){.stand{grid-template-columns:260px 1fr}}
.card-stand{background:var(--ivory);border:1px solid var(--gold);border-radius:6px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;max-width:260px}
.card-stand img{width:150px;height:auto}
.qr{width:150px;height:150px;background:#fff;padding:8px;border-radius:4px;display:grid;place-items:center}
.qr img,.qr canvas{width:134px!important;height:134px!important}
.card-stand p{margin:0;font-family:var(--display);font-size:1.15rem;color:var(--green);font-weight:600}

/* Charts */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .tip{position:absolute;pointer-events:none;background:var(--green);color:var(--ivory);font-size:.8rem;padding:6px 9px;border-radius:4px;white-space:nowrap;transform:translate(-50%,-100%);margin-top:-8px}
.hbars{display:flex;flex-direction:column;gap:10px}
.hb{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;font-size:.9rem}
.hb .track{grid-column:1/-1;height:10px;background:var(--vellum);border-radius:2px;overflow:hidden}
.hb .fill{height:100%;background:var(--green-2);border-radius:0 4px 4px 0}
.hb .v{font-variant-numeric:tabular-nums;font-weight:700}
.money-list{display:flex;flex-direction:column}
.money-list div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.money-list div.total{border-bottom:0;border-top:1px solid var(--gold);font-family:var(--display);font-size:1.35rem;font-weight:700;color:var(--green)}
pre.csv{background:var(--vellum);border:1px solid var(--line);border-radius:4px;padding:12px;font-size:.78rem;overflow:auto;max-height:280px;margin:0}

/* Hours */
.hours{display:flex;flex-direction:column}
.hrow{display:grid;grid-template-columns:52px 1fr 1fr auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.hrow b{color:var(--green)}
.hrow.closed .in{opacity:.4}

.locked{text-align:center;padding:60px 20px;display:flex;flex-direction:column;gap:10px;align-items:center}
.locked h2{font-size:1.8rem}
.locked p{color:var(--muted);max-width:44ch;margin:0}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);background:var(--green);color:var(--ivory);padding:11px 14px 11px 16px;border-radius:4px;font-size:.9rem;z-index:60;display:flex;gap:14px;align-items:center;max-width:calc(100vw - 32px);box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast button{background:none;border:0;color:var(--gold-soft);font-weight:700;text-decoration:underline}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>


<div class="shell">
  <aside class="side">
    <div class="brand"><b>The Rising Sun Inn</b><span>Admin · Abersychan</span></div>
    <nav class="nav" id="nav" aria-label="Admin sections"></nav>
    <div class="side-foot">Signed in as <b>Owner</b><br>Changes publish to the menu instantly.</div>
  </aside>
  <div class="main">
    <div class="topbar">
      <span class="example">PROTOTYPE · EXAMPLE DATA</span>
      <button class="status-pill" id="pill"><i></i><span>Online ordering active</span></button>
      <label class="role" for="role">Viewing as
        <select id="role"><option value="owner">Owner</option><option value="manager">Manager</option><option value="bar">Bar staff</option></select>
      </label>
    </div>
    <main class="content" id="view"></main>
  </div>
</div>
<div id="drawer-root"></div>
<div class="toast" id="toast" role="status" hidden><span id="toast-msg"></span><button id="toast-undo" hidden>Undo</button></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
// ================= Data (example only, prices in pence) =================
const MOD_GROUPS = {
  mixer:{name:"Mixers",options:[["No mixer",0],["Fever-Tree Indian tonic",180],["Fever-Tree Light tonic",180],["Lemonade",120],["Coca-Cola",120],["Diet Coke",120]]},
  serve:{name:"Serve (neat / ice / water)",options:[["Neat",0],["With ice",0],["Splash of water",0]]},
  milk:{name:"Milk choice",options:[["Whole",0],["Semi-skimmed",0],["Oat milk",40]]}
};
const ALLERGENS = ["Celery","Cereals containing gluten","Crustaceans","Eggs","Fish","Lupin","Milk","Molluscs","Mustard","Tree nuts","Peanuts","Sesame","Soya","Sulphites"];
let uid=100; const id=()=>"d"+(uid++);
const V=(label,price,on=true)=>({id:id(),label,price,on});
const HP=(h,p)=>[V("Half pint",h),V("Pint",p)];
const SD=(s,d)=>[V("Single 25ml",s),V("Double 50ml",d)];
const WINE=(a,b,c,bt)=>[V("125ml glass",a),V("175ml glass",b),V("250ml glass",c),V("Bottle 750ml",bt)];
let CATS=[
  {id:"draught",name:"Draught Beer & Lager",visible:true},{id:"bottles",name:"Bottled Beer & Cider",visible:true},
  {id:"white",name:"White Wine",visible:true},{id:"red",name:"Red Wine",visible:true},{id:"rose",name:"Rosé & Sparkling",visible:true},
  {id:"spirits",name:"Spirits",visible:true},{id:"cocktails",name:"Cocktails",visible:true},{id:"soft",name:"Soft Drinks",visible:true},
  {id:"af",name:"Alcohol-Free",visible:true},{id:"hot",name:"Hot Drinks",visible:true},{id:"food",name:"Bar Snacks",visible:false}];
const D=(key,cat,name,desc,o)=>({key,id:id(),cat,name,desc,abv:o.abv??null,welsh:!!o.welsh,noIce:o.noIce??(cat==="soft"||(o.mods||[]).includes("mixer")),alc:o.alc!==false,on:o.on!==false,archived:false,
  allergens:o.allergens||[],mods:o.mods||[],variants:o.variants,photo:null,vat:20});
let DRINKS=[

function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

const byKey=k=>DRINKS.find(d=>d.key===k);
const POP=[["moretti",1,9],["cwtch",1,6],["sa",1,5],["carling",1,5],["sauv",1,4],["merlot",1,3],["gordons",1,3,180],["dietcoke",1,4],["coke",1,3],["blackdragon",0,2],["aperol",0,2],["espresso",0,2],["g00",0,1],["latte",0,1],["prosecco",1,1],["penderyn",0,1,0],["pg",1,2],["moretti",0,2]];
const POPW=POP.reduce((s,p)=>s+p[2],0);
function pickLine(){let r=R()*POPW;for(const p of POP){if((r-=p[2])<0){const d=byKey(p[0]),v=d.variants[p[1]];const extra=p[3]||0;
  return {name:d.name,cat:d.cat,size:v.label+(p[0]==="gordons"?" + Fever-Tree tonic":"")+(d.noIce&&R()<.3?" · No ice":""),unit:v.price+extra,qty:R()<.25?2:1}}}}

function drawSizes(){
  $("#ed-sizes").innerHTML=ed.variants.map((x,i)=>`<div class="size" data-i="${i}">
    <input class="in" value="${esc(x.label)}" placeholder="Size, e.g. Pint" aria-label="Size name">

    <div style="display:flex;align-items:center;gap:6px">${sw(x.on,`data-szon="${i}" aria-label="Size available"`,false)}</div>
    <button type="button" class="rm" data-rm="${i}" aria-label="Remove size" ${ed.variants.length===1?"disabled":""}>✕</button></div>`).join("");
  $("#ed-sizes").onclick=e=>{const r=e.target.closest("[data-rm]"),o=e.target.closest("[data-szon]");
    if(r&&!r.disabled){syncSizes();ed.variants.splice(+r.dataset.rm,1);drawSizes()}
    if(o){const x=ed.variants[+o.dataset.szon];x.on=!x.on;o.setAttribute("aria-checked",x.on)}};
}
function syncSizes(){document.querySelectorAll("#ed-sizes .size").forEach(row=>{const x=ed.variants[+row.dataset.i];const [l,p]=row.querySelectorAll("input.in");x.label=l.value.trim();x._raw=p.value.trim();x.price=Math.round(parseFloat(p.value.replace(/[£,]/g,""))*100)||0})}
function saveDrink(){
  syncSizes();
  const err=$("#ed-err"),name=$("#ed-name").value.trim();
  const bad=ed.variants.find(x=>!x.label||!/^\d+(\.\d{1,2})?$/.test((x._raw||"").replace(/[£,]/g,""))||x.price<=0);
  if(!name){err.hidden=false;err.textContent="Give the drink a name so customers can find it.";$("#ed-name").focus();return}
  if(bad){err.hidden=false;err.textContent="Each size needs a name and a price, written like 6.20.";return}
  const abv=$("#ed-abv").value.trim();
  if(abv&&isNaN(+abv)){err.hidden=false;err.textContent="ABV should be a number, like 4.5.";return}
  Object.assign(ed,{name,cat:$("#ed-cat").value,desc:$("#ed-desc").value.trim(),abv:abv===""?null:+abv,alc:$("#ed-alc").checked,welsh:$("#ed-welsh").checked,noIce:$("#ed-noice").checked,vat:+$("#ed-vat").value,
    mods:[...document.querySelectorAll("[data-mod]:checked")].map(c=>c.dataset.mod),allergens:[...document.querySelectorAll("[data-alg]:checked")].map(c=>c.dataset.alg)});
  ed.variants.forEach(x=>delete x._raw);
  if(ed.id){const i=DRINKS.findIndex(d=>d.id===ed.id);DRINKS[i]=ed}else{ed.id=id();ed.key=ed.id;DRINKS.push(ed)}
  const n=ed.name;closeDrawer();
  if(view!=="drinks")show("drinks");else render();
  toast(`${n} saved and live on the customer menu`);
}

  $("#rr").onclick=e=>{const b=e.target.closest("[data-r]");if(b){range=b.dataset.r;vReports(v)}};
  $("#csv").onclick=()=>{const rows=[["order","time","table","item","size","qty","unit_price_gbp","line_total_gbp","vat_gbp","payment","status","refunded_gbp"]];
    ORDERS.forEach(o=>o.lines.forEach((l,i)=>rows.push([o.no,o.time,o.table,l.name,l.size,l.qty,(l.unit/100).toFixed(2),(l.unit*l.qty/100).toFixed(2),(l.unit*l.qty/600).toFixed(2),o.method,o.status,i===0?(o.refunded/100).toFixed(2):"0.00"])));
    const csv=rows.map(r=>r.map(c=>/[",]/.test(c)?`"${String(c).replace(/"/g,'""')}"`:c).join(",")).join("\n");
    $("#csv-box").innerHTML=`<section class="panel"><div class="panel-h"><h2>CSV export</h2><button class="btn sm" id="csv-copy">Copy to clipboard</button></div><p class="muted" style="margin:0">In the live app this downloads as a file you can open in Excel. Here you can copy it.</p><pre class="csv" id="csv-pre">${esc(csv)}</pre></section>`;
    $("#csv-copy").onclick=()=>{navigator.clipboard.writeText(csv).then(()=>toast("CSV copied")).catch(()=>{const r=document.createRange();r.selectNodeContents($("#csv-pre"));const s=getSelection();s.removeAllRanges();s.addRange(r);toast("Press Ctrl+C or Cmd+C to copy")})};
    $("#csv-box").scrollIntoView({behavior:"smooth"})};
}
function hourChart(el,list){
  const hrs=[];for(let h=12;h<=23;h++)hrs.push({h,v:list.filter(o=>o.hour===h).reduce((s,o)=>s+o.total,0),n:list.filter(o=>o.hour===h).length});
  const W=640,H=230,L=48,B=28,T=10,max=Math.max(...hrs.map(x=>x.v));
  const step=[2000,5000,10000,20000,25000,50000].find(s=>max/s<=5)||50000, top=Math.ceil(max/step)*step||step;
  const y=v=>T+(H-T-B)*(1-v/top), bw=(W-L)/hrs.length, barW=Math.min(30,bw-8);
  let g="";for(let t=0;t<=top;t+=step)g+=`<line x1="${L}" x2="${W}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${y(t)+4}" text-anchor="end" font-size="11" fill="var(--muted)">£${t/100}</text>`;
  const bars=hrs.map((x,i)=>{const cx=L+bw*i+bw/2,x0=cx-barW/2,y0=y(x.v),h=H-B-y0,r=Math.min(4,h);
    const path=x.v?`<path d="M${x0},${H-B} V${y0+r} Q${x0},${y0} ${x0+r},${y0} H${x0+barW-r} Q${x0+barW},${y0} ${x0+barW},${y0+r} V${H-B} Z" fill="var(--green-2)"/>`:"";
    return `<g class="hit" data-i="${i}" tabindex="0" aria-label="${x.h}:00, ${gbp(x.v)} from ${x.n} orders"><rect x="${L+bw*i}" y="${T}" width="${bw}" height="${H-T-B}" fill="transparent"/>${path}<text x="${cx}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)">${x.h}:00</text></g>`}).join("");
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Sales by hour">${g}<line x1="${L}" x2="${W}" y1="${H-B}" y2="${H-B}" stroke="var(--line-2)"/>${bars}</svg><div class="tip" hidden></div>`;
  const tip=el.querySelector(".tip"),svg=el.querySelector("svg");
  const showTip=g=>{const i=+g.dataset.i,x=hrs[i],r=svg.getBoundingClientRect(),k=r.width/W;
    tip.innerHTML=`<b>${x.h}:00–${x.h}:59</b><br>${gbp(x.v)} · ${x.n} order${x.n===1?"":"s"}`;tip.hidden=false;
    tip.style.left=Math.max(60,Math.min(r.width-60,(L+bw*i+bw/2)*k))+"px";tip.style.top=Math.max(40,y(x.v)*k)+"px"};
  el.querySelectorAll(".hit").forEach(g=>{g.onmouseenter=g.onfocus=()=>showTip(g);g.onclick=()=>showTip(g);g.onmouseleave=g.onblur=()=>tip.hidden=true});
}

// ================= Staff =================
const ROLE_NAMES={owner:"Owner",manager:"Manager",bar:"Bar staff"};
function vStaff(v){
  v.innerHTML=`<div class="view-h"><div><h1>Staff accounts</h1><p>Everyone gets their own login, so the system records who changed what. Switch off accounts when people leave.</p></div></div>
  <div class="tw"><table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Last active</th><th>Account</th></tr></thead><tbody>
  ${STAFF.map((s,i)=>`<tr><td><b>${esc(s.name)}</b></td><td style="overflow-wrap:anywhere">${esc(s.email)}</td>
    <td>${s.role==="owner"?"Owner":`<select class="in" data-srole="${i}" style="height:36px;width:auto" aria-label="Role for ${esc(s.name)}">${["manager","bar"].map(r=>`<option value="${r}" ${s.role===r?"selected":""}>${ROLE_NAMES[r]}</option>`).join("")}</select>`}</td>
    <td class="muted">${s.last}</td><td><span style="display:flex;gap:8px;align-items:center">${s.role==="owner"?'<span class="pill p-ok">Active</span>':sw(s.on,`data-son="${i}" aria-label="${esc(s.name)} can sign in"`)}</span></td></tr>`).join("")}</tbody></table></div>
  <div class="grid2" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))">
    <section class="panel"><h2>Invite a team member</h2><form id="sinv" style="display:flex;flex-direction:column;gap:12px" novalidate>
      <label class="field"><span>Name</span><input class="in" id="sn"></label><label class="field"><span>Email</span><input class="in" id="se" type="email"></label>
      <label class="field"><span>Role</span><select class="in" id="sr"><option value="bar">Bar staff</option><option value="manager">Manager</option></select></label>
      <p class="err" id="serr" hidden></p><button class="btn" style="align-self:flex-start">Send invite</button></form></section>
    <section class="panel"><h2>What each role can do</h2><div class="money-list">
      <div><span><b>Owner</b><br><small class="muted">Everything, including staff, tables, QR code, payment and venue settings</small></span></div>
      <div><span><b>Manager</b><br><small class="muted">Orders, drinks, prices, stock, categories, pausing, refunds and reports</small></span></div>
      <div><span><b>Bar staff</b><br><small class="muted">Bar iPad orders, order status and stock on/off. No prices, refunds or accounts</small></span></div></div></section></div>`;
  v.querySelectorAll("[data-son]").forEach(b=>b.onclick=()=>{const s=STAFF[+b.dataset.son];s.on=!s.on;vStaff(v);toast(`${s.name} ${s.on?"can sign in again":"can no longer sign in"}`)});
  v.querySelectorAll("[data-srole]").forEach(sel=>sel.onchange=()=>{const s=STAFF[+sel.dataset.srole];s.role=sel.value;toast(`${s.name} is now ${ROLE_NAMES[s.role]}`)});
  $("#sinv").onsubmit=e=>{e.preventDefault();const n=$("#sn").value.trim(),em=$("#se").value.trim(),err=$("#serr");
    if(!n||!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em)){err.hidden=false;err.textContent="Add their name and a valid email address.";return}
    STAFF.push({name:n,email:em,role:$("#sr").value,last:"Invite sent",on:true});vStaff(v);toast("Invite sent to "+em)};
}

// ================= Venue settings =================
function vVenue(v){
  v.innerHTML=`<div class="view-h"><div><h1>Venue settings</h1><p>These apply to every customer and the bar iPad. Save each section when you're done.</p></div></div>
  ${orderingCard()}
  <div class="grid2" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr))">
    <section class="panel"><h2>Ordering hours</h2><p class="muted" style="margin:0;font-size:.88rem">Outside these hours customers can browse but not pay. Keep them inside your premises licence hours.</p>
      <div class="hours">${SETTINGS.hours.map((h,i)=>`<div class="hrow ${h[3]?"closed":""}"><b>${h[0]}</b><input class="in num" type="time" value="${h[1]}" data-h="${i}|1" aria-label="${h[0]} opens" ${h[3]?"disabled":""}><input class="in num" type="time" value="${h[2]}" data-h="${i}|2" aria-label="${h[0]} closes" ${h[3]?"disabled":""}><label class="ck"><input type="checkbox" data-hc="${i}" ${h[3]?"checked":""}>Closed</label></div>`).join("")}</div>
      <button class="btn" data-save="Ordering hours" style="align-self:flex-start">Save hours</button></section>
    <section class="panel"><h2>Pause message</h2><label class="field"><span>Customers see this while ordering is paused</span><textarea class="in" id="pmsg">${esc(SETTINGS.pauseMsg)}</textarea></label>
      <h2 style="margin-top:6px">Bar iPad wait alerts</h2>
      <div class="row2"><label class="field"><span>Amber after (minutes)</span><input class="in num" id="amber" type="number" min="1" value="${SETTINGS.amber}"></label><label class="field"><span>Red after (minutes)</span><input class="in num" id="red" type="number" min="2" value="${SETTINGS.red}"></label></div>
      <p class="err" id="werr" hidden></p><button class="btn" id="save-ops" style="align-self:flex-start">Save</button></section>
    <section class="panel"><h2>Age &amp; alcohol</h2><label class="field"><span>Age declaration shown at checkout</span><textarea class="in" id="agetext">${esc(SETTINGS.ageText)}</textarea><small>Staff still check ID on delivery (Challenge 25). Ticking this box is not a legal age check.</small></label>
      <button class="btn" data-save="Age declaration" style="align-self:flex-start">Save</button></section>
    <section class="panel"><h2>VAT &amp; receipts</h2>
      <label class="ck"><input type="checkbox" id="vatreg" ${SETTINGS.vatReg?"checked":""}>We're VAT-registered (prices include VAT)</label>
      <label class="field"><span>VAT registration number</span><input class="in num" id="vatno" placeholder="GB 123 4567 89" value="${esc(SETTINGS.vatNo)}"><small>Printed on every email receipt.</small></label>
      <div class="row2"><label class="field"><span>Receipt sender name</span><input class="in" value="${esc(SETTINGS.sender)}"></label><label class="field"><span>Replies go to</span><input class="in" type="email" placeholder="hello@yourdomain" value="${esc(SETTINGS.replyTo)}"></label></div>
      <label class="field"><span>Delete customer email addresses after</span><select class="in"><option>30 days</option><option selected>90 days</option><option>1 year</option></select><small>Orders and sales figures are kept; only the email address is removed.</small></label>
      <button class="btn" data-save="VAT & receipts" style="align-self:flex-start">Save</button></section>
    <section class="panel"><h2>Payments</h2><div class="money-list">
      <div><span>Stripe account</span><span class="pill p-warn">Test mode</span></div><div><span>Apple Pay domain</span><span class="pill p-neutral">Not registered yet</span></div>
      <div><span>Google Pay</span><span class="pill p-ok">Ready</span></div><div><span>Payouts</span><span class="muted">Daily, to your business bank account</span></div></div>
      <small class="muted">Secret payment keys are never shown here. They're stored on the server only.</small></section>
  </div>`;
  bindPause();
  v.querySelectorAll("[data-hc]").forEach(c=>c.onchange=()=>{SETTINGS.hours[+c.dataset.hc][3]=c.checked;vVenue(v)});
  v.querySelectorAll("[data-h]").forEach(i=>i.onchange=()=>{const [d,k]=i.dataset.h.split("|");SETTINGS.hours[+d][+k]=i.value});
  v.querySelectorAll("[data-save]").forEach(b=>b.onclick=()=>toast(b.dataset.save+" saved"));
  $("#save-ops").onclick=()=>{const a=+$("#amber").value,r=+$("#red").value,err=$("#werr");
    if(!(a>0)||!(r>a)){err.hidden=false;err.textContent="Red needs to be a bigger number than amber, for example 5 and 10.";return}
    err.hidden=true;SETTINGS.amber=a;SETTINGS.red=r;SETTINGS.pauseMsg=$("#pmsg").value.trim()||SETTINGS.pauseMsg;toast("Pause message and wait alerts saved")};
}

renderNav();render();
</script>
